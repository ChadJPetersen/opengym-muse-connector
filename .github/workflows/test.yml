name: Validate Muse connector
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/server.mjs
          node --check src/lib.mjs
          node --check test/server.test.mjs
          node --check scripts/redeem-pairing-code.mjs
      - name: Run tests
        run: npm test
